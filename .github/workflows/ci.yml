name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate structure
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: nightshift-extension
          path: dist/*.zip

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nightshift-site:ci .
