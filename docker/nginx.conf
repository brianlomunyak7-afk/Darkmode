server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets with sensible caching.
    location ~* \.(?:css|js|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # The extension download: force a download, no caching surprises.
    location /downloads/ {
        add_header Content-Disposition "attachment";
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
